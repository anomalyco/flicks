[workspace]
resolver = "3"
# Rust crates live in crates/. Rust apps (the Rune desktop and admin apps) are added under apps/
# by path as they land; apps/apple and apps/android are Xcode and Gradle projects, not members.
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
# Production code denies unwrap/expect/panic per crate with
# `#![cfg_attr(not(test), deny(clippy::unwrap_used, ...))]` in lib.rs; tests may use them.
# Codec code indexes parallel arrays by loop counter as the specifications are written.
needless_range_loop = "allow"
type_complexity = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Signatures dominate debug test time; optimize the crypto crates in dev builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Codec hot loops: debug-build tests (conformance and oracle vectors) are minutes slower below
# opt-level 3.
[profile.dev.package.flicks-h264]
opt-level = 3

[profile.dev.package.flicks-hevc]
opt-level = 3

[profile.dev.package.flicks-av1]
opt-level = 3

[profile.dev.package.flicks-vp9]
opt-level = 3

[profile.dev.package.flicks-aac]
opt-level = 3

[profile.dev.package.flicks-ac3]
opt-level = 3

[profile.dev.package.flicks-opus]
opt-level = 3
