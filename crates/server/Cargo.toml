[package]
name = "flicks-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "flicks"
path = "src/main.rs"

[dependencies]
flicks-client = { path = "../client" }
flicks-container = { path = "../container", features = ["matroska"] }
flicks-h264 = { path = "../h264" }
flicks-hevc = { path = "../hevc" }
flicks-av1 = { path = "../av1" }
flicks-vp9 = { path = "../vp9" }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
flicks-library = { path = "../library" }
flicks-metadata = { path = "../metadata" }
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
hkdf = "0.13"
hmac = "0.13"
if-addrs = "0.15"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
flicks-platform = { path = "../platform" }
socket2 = "0.6"

[dev-dependencies]
flicks-testkit = { path = "../testkit" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }
