[package]
name = "flicks-metadata"
description = "Names from paths (title, year, season, episode, edition), TMDB matching and WebP artwork cache."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "UNLICENSED"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1"
thiserror = "2"
ureq = "3"
webp = "0.3"

[dev-dependencies]
tempfile = "3"
