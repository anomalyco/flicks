[package]
name = "flicks-client"
description = "Client core: device key, server list, pairing, signed requests, address racing, catalog and byte ranges."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
data-encoding = "2.11.1"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki-roots = "1.0.11"

[target.'cfg(windows)'.dependencies]
flicks-platform = { path = "../platform" }

[dev-dependencies]
flicks-container = { path = "../container" }
flicks-server = { path = "../server" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util"] }
