[package]
name = "flicks-ui"
description = "The Flicks app's screens (Rune), shared by the desktop and web apps."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
flicks-client = { path = "../client" }
qrcode = { version = "0.14.1", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "e450c92b26a6bf4a85304f6ee4a2fe5d55db617b", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
