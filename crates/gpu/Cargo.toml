[package]
name = "flicks-gpu"
description = "Single-pass NV12/P010 video drawing on the application's wgpu device."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
bytemuck = "1.25"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBufferIOSurface", "objc2-io-surface"] }
objc2-io-surface = "0.3.2"
objc2-metal = "0.3.2"

[dev-dependencies]
pollster = "0.4"
