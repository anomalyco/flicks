[package]
name = "flicks-h264"
description = "Pure-Rust H.264/AVC decoder (ITU-T H.264). Copied from FilmCraft."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
flicks-container = { path = "../container", default-features = false, features = ["bitstream"] }
thiserror = "2"
rayon = { version = "1", optional = true }

[dev-dependencies]
flicks-testkit = { path = "../testkit" }
