[package]
name = "flicks-platform"
description = "OS hardware video decode. VideoToolbox FFI adapted from FilmCraft."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
flicks-container = { path = "../container", default-features = false, features = ["isobmff"] }
flicks-h264 = { path = "../h264" }
flicks-hevc = { path = "../hevc" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-video-toolbox = "0.3.2"
objc2-io-surface = "0.3.2"

[dev-dependencies]
flicks-testkit = { path = "../testkit" }
