[package]
name = "flicks-av1"
description = "Pure-Rust AV1 decoder. Copied from FilmCraft."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
flicks-container = { path = "../container", default-features = false, features = ["bitstream"] }
thiserror = "2"
rayon = { version = "1", optional = true }

[dev-dependencies]
flicks-testkit = { path = "../testkit" }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
