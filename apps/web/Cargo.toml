[package]
name = "flicks-web"
description = "Flicks in the browser: the flicks-ui screens on Rune's web host, served by the Flicks server."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only; natively the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
flicks-client = { path = "../../crates/client" }
flicks-ui = { path = "../../crates/ui" }
# The web host has no system fonts: bundle Inter.
rune = { git = "https://github.com/anomalyco/rune", rev = "e450c92b26a6bf4a85304f6ee4a2fe5d55db617b", default-features = false, features = ["embedded-fonts"] }
js-sys = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
