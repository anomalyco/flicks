<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121316">
<title>Flicks</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#121316;color:#f4f4f4}#status{font:16px system-ui;padding:24px}</style>
<div id="status">Loading…</div>
<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('Flicks needs a browser with WebGPU (Safari 26, Chrome or Edge), over HTTPS.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
}
</script>
</html>
